name: Continuous Deployment - Azure Dev Environment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-azure-dev:
    name: Deploy Services to Azure Dev (App Service / Container Apps)
    runs-on: ubuntu-latest
    if: github.repository == 'mohamedth8/Portfolio' || true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC / Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - name: Deploy FinHub API to Azure App Service
        run: |
          echo "Deploying FinHub.Api to Azure Container Apps / App Service..."
          echo "Azure deployment step initialized for mohamedth8 environment."
