name: FinTech Platform CI Pipeline

on:
  push:
    branches: [ main, master, develop, "feature/*", "bugfix/*" ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend-build-test:
    name: .NET 10 Build, Lint & xUnit Tests
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "FinTechSecurePassword2026!"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore FinTech.slnx

      - name: Build .NET Solution
        run: dotnet build FinTech.slnx --configuration Release --no-restore

      - name: Execute Unit & Integration Tests
        run: dotnet test FinTech.slnx --configuration Release --no-build --verbosity normal

  frontend-build-test:
    name: Angular 22 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/Web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/Web
        run: npm ci

      - name: Build Production Angular Bundle
        working-directory: src/Web
        run: npm run build -- --configuration production

  docker-security-build:
    name: Container Build & Vulnerability Scan
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build FinHub API Docker Image
        run: docker build -t finhub-api:latest -f src/FinHub/FinHub.Api/Dockerfile .

      - name: Build PayCore Ledger Docker Image
        run: docker build -t paycore-ledger:latest -f src/PayCore/Services/PayCore.LedgerService/Dockerfile .

      - name: Build Angular Web Docker Image
        run: docker build -t finhub-web:latest -f src/Web/Dockerfile src/Web
